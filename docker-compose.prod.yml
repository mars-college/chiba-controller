services:
  postgres:
    image: postgres:16-alpine
    container_name: chiba-controller-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chiba}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chiba}
      POSTGRES_DB: ${POSTGRES_DB:-chiba3}
    ports:
      - "${POSTGRES_PORT:-54339}:5432"
    volumes:
      - chiba_controller_prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chiba} -d ${POSTGRES_DB:-chiba3}"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: chiba-controller-prod-minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - chiba_controller_prod_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:latest
    container_name: chiba-controller-prod-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh -c
    command: >
      "until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin}; do sleep 1; done
      && mc mb --ignore-existing local/${CHIBA3_S3_BUCKET:-chiba-controller}
      && mc anonymous set download local/${CHIBA3_S3_BUCKET:-chiba-controller}
      && exit 0"
    restart: "no"

  db-migrate:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: chiba-controller-prod-db-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CHIBA3_DB_URL: postgresql://${POSTGRES_USER:-chiba}:${POSTGRES_PASSWORD:-chiba}@postgres:5432/${POSTGRES_DB:-chiba3}
    command: ["pnpm", "-C", "packages/db", "migrate"]
    restart: "no"

  db-import-registries:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: chiba-controller-prod-db-import-registries
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    environment:
      CHIBA3_DB_URL: postgresql://${POSTGRES_USER:-chiba}:${POSTGRES_PASSWORD:-chiba}@postgres:5432/${POSTGRES_DB:-chiba3}
    command:
      [
        "pnpm",
        "db:import:registry",
        "--",
        "--registry",
        "./config/registry.prod.toml",
        "--registry-id",
        "prod"
      ]
    restart: "no"

  control-api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: chiba-controller-prod-control-api
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      db-import-registries:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8795
      CHIBA3_NAMESPACE: ${CHIBA3_NAMESPACE:-prod}
      CHIBA3_REGISTRY_ID: ${CHIBA3_REGISTRY_ID:-prod}
      CHIBA3_DB_URL: postgresql://${POSTGRES_USER:-chiba}:${POSTGRES_PASSWORD:-chiba}@postgres:5432/${POSTGRES_DB:-chiba3}
      CHIBA3_GUIDE_BASE_URL: ${CHIBA3_GUIDE_BASE_URL:-http://10.10.13.9:${GUIDE_PORT:-5173}}
      SHARE_ROOT: /share
      CHIBA3_THUMBNAIL_BACKEND: minio
      CHIBA3_S3_ENDPOINT_URL: http://minio:9000
      CHIBA3_S3_BUCKET: ${CHIBA3_S3_BUCKET:-chiba-controller}
      CHIBA3_S3_PUBLIC_BASE_URL: ${CHIBA3_S3_PUBLIC_BASE_URL:-http://10.10.13.9:${MINIO_API_PORT:-9000}}
      CHIBA3_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      CHIBA3_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      EDEN_API_KEY: ${EDEN_API_KEY:-}
      CHIBA3_REMOTE_URL: ${CHIBA3_REMOTE_URL:-}
      CHIBA3_BOOTSTRAP_NODE_CONTROL_API_URL: ${CHIBA3_BOOTSTRAP_NODE_CONTROL_API_URL:-http://10.10.13.9:${CONTROL_API_PORT:-8795}}
      CHIBA3_BOOTSTRAP_GUIDE_BASE_URL: ${CHIBA3_BOOTSTRAP_GUIDE_BASE_URL:-http://10.10.13.9:${GUIDE_PORT:-5173}}
    command: ["pnpm", "-C", "apps/control-api", "start"]
    ports:
      - "${CONTROL_API_PORT:-8795}:8795"
    volumes:
      - chiba_controller_prod_share_root:/share
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8795/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20

  ops:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: chiba-controller-prod-ops
    init: true
    depends_on:
      control-api:
        condition: service_healthy
    restart: unless-stopped
    environment:
      CHIBA3_CONTROL_API_PROXY_TARGET: http://control-api:8795
    command: ["pnpm", "-C", "apps/ops", "start"]
    ports:
      - "${OPS_PORT:-8792}:8792"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8792/ops/ >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20

  guide:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: chiba-controller-prod-guide
    init: true
    depends_on:
      control-api:
        condition: service_healthy
    restart: unless-stopped
    environment:
      CHIBA3_CONTROL_API_PROXY_TARGET: http://control-api:8795
    command: ["pnpm", "-C", "apps/guide", "start"]
    ports:
      - "${GUIDE_PORT:-5173}:5173"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5173/ >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20

  node-runtime:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: chiba-controller-prod-node-runtime
    profiles: ["node"]
    init: true
    depends_on:
      control-api:
        condition: service_healthy
    restart: unless-stopped
    environment:
      CHIBA3_CONTROL_API_URL: http://control-api:8795
      CHIBA3_NODE_ID: ${CHIBA3_NODE_ID:-pi-local}
      CHIBA3_NAMESPACE: ${CHIBA3_NAMESPACE:-prod}
      SHARE_ROOT: /share
    command: ["pnpm", "-C", "packages/node-runtime", "start"]
    ports:
      - "${NODE_RUNTIME_GUIDE_PORT:-8080}:8080"
      - "${NODE_RUNTIME_API_PORT:-8787}:8787"
    volumes:
      - chiba_controller_prod_share_root:/share

  control-mcp:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: chiba-controller-prod-control-mcp
    profiles: ["mcp"]
    init: true
    depends_on:
      control-api:
        condition: service_healthy
    restart: unless-stopped
    environment:
      CHIBA3_CONTROL_API_URL: http://control-api:8795
    command: ["pnpm", "-C", "apps/control-mcp", "start"]
    stdin_open: true
    tty: true

volumes:
  chiba_controller_prod_postgres_data:
  chiba_controller_prod_minio_data:
  chiba_controller_prod_share_root:
